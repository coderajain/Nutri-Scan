version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nutriscan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutriscan}
      POSTGRES_USER: ${POSTGRES_USER:-nutriscan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriscan_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutriscan_user} -d ${POSTGRES_DB:-nutriscan}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nutriscan_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutriscan_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nutriscan}
      POSTGRES_USER: ${POSTGRES_USER:-nutriscan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriscan_secure_pass_2026}
      SECRET_KEY: ${SECRET_KEY:-94a5e3f48a12e84d72bc9166f283d5a49c0683058b8f2d57929a531bcf91c01e}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      EVIDENCE_DIR: /app/data/evidence
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nutriscan.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword@2026!}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@nutriscan.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPassword@2026!}
    volumes:
      - evidence_storage:/app/data/evidence
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nutriscan_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutriscan_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - nutriscan_net

volumes:
  postgres_data:
    driver: local
  evidence_storage:
    driver: local

networks:
  nutriscan_net:
    driver: bridge
